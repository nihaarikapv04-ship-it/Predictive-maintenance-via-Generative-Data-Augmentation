[theme]
base = "dark"
primaryColor = "#00d4ff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b27"
textColor = "#e8eaf6"

[ui]
hideTopBar = false

[server]
headless = true
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"

[runner]
magicEnabled = false

[browser]
gatherUsageStats = false
